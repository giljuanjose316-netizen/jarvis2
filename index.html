<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jarvis - asistente personal por voz con cámara">
  <title>Jarvis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="jarvis-panel" aria-label="Jarvis">
      <div class="status-dot" aria-hidden="true"></div>
      <p class="eyebrow">PERSONAL VOICE ASSISTANT</p>
      <h1>JARVIS</h1>
      <p id="status">Sistema listo.</p>

      <button id="micButton" type="button" aria-label="Activar micrófono">
        <span aria-hidden="true">🎙</span>
      </button>

      <div class="camera-area">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="photoCanvas" hidden></canvas>
        <p id="cameraStatus">Cámara inactiva.</p>
        <div class="camera-controls">
          <button id="cameraButton" type="button">Activar cámara</button>
          <button id="cameraOffButton" type="button" disabled>Desactivar cámara</button>
        </div>
      </div>

      <p class="hint">Di: «Jarvis, toma una foto» o «Jarvis, desactiva la cámara».</p>
      <p id="transcript" class="transcript" aria-live="polite"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
